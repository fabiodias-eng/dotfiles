# =========================
# TMUX STATUS BAR
# =========================

set -g status-interval 1
set -g status-style bg="#3c3836",fg="#a89984"

set -g pane-border-lines single
set -g status-left ""

set -g window-status-format " #I#W "
set -g window-status-current-format " #I#W #{?window_zoomed_flag,#[fg=color14] ,}"
setw -g window-status-current-style fg="#ebdbb2",bg="#689d6a",bold

set -g status-right "#{?#{==:#{pane_current_command},nvim},, #(~/.local/bin/tmux-status/tmux-git #{pane_current_path} '#ebdbb2' '#458588')}#[fg="#ebdbb2",bg="#689d6a",bold] Session#S"
